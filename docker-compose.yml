services:
  probe-interview:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      STRONG_PROVIDER: ${STRONG_PROVIDER:-openai}
      SETUP_PROVIDER: ${SETUP_PROVIDER:-groq}
      MAX_TURNS: ${MAX_TURNS:-14}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-2000}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      RATE_LIMIT_NEW_SESSIONS_PER_HOUR: ${RATE_LIMIT_NEW_SESSIONS_PER_HOUR:-10}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD}
      ACCESS_MAX_ATTEMPTS: ${ACCESS_MAX_ATTEMPTS:-5}
      ACCESS_COOLDOWN_MINUTES: ${ACCESS_COOLDOWN_MINUTES:-10}
      ACCESS_SESSION_HOURS: ${ACCESS_SESSION_HOURS:-12}
      ACCESS_COOKIE_SECURE: ${ACCESS_COOKIE_SECURE:-true}
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.probe-interview.rule=Host(`probe.midhunpm.in`)
      - traefik.http.routers.probe-interview.entrypoints=websecure
      - traefik.http.routers.probe-interview.tls.certresolver=letsencrypt
      - traefik.http.routers.probe-interview.middlewares=probe-interview-noindex
      - traefik.http.middlewares.probe-interview-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive
      - traefik.http.services.probe-interview.loadbalancer.server.port=8000

networks:
  dokploy-network:
    external: true
