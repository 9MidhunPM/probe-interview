<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probe Interview</title>
  <style>
    :root { color-scheme: dark; --ink: #eaf1f5; --muted: #9aacb8; --canvas: #101922; --panel: #17232e; --line: #2d4150; --signal: #70e1bd; --candidate: #233447; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top left, #1c3440, var(--canvas) 45%); color: var(--ink); font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(100%, 1050px); margin: 0 auto; padding: 28px 18px 48px; }
    header { border-left: 4px solid var(--signal); padding-left: 16px; margin-bottom: 24px; }
    h1, h2, h3, p { margin: 0; } h1 { font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.05em; } h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); } p { color: var(--muted); }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .8fr); gap: 18px; } .card { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); padding: 18px; }
    label { display: block; margin: 14px 0 6px; font-weight: 700; } select, textarea, input, button { width: 100%; font: inherit; } select, textarea, input { background: #0d151d; color: var(--ink); border: 1px solid var(--line); padding: 10px; } textarea { min-height: 150px; resize: vertical; } button { cursor: pointer; border: 0; background: var(--signal); color: #08221a; font-weight: 800; padding: 11px 14px; margin-top: 12px; } button:disabled { cursor: not-allowed; opacity: .5; } button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #b4ffe5; outline-offset: 2px; }
    #chat { display: grid; gap: 12px; min-height: 420px; } .message { padding: 13px; border-left: 3px solid var(--line); background: #121d27; white-space: pre-wrap; } .message.candidate { background: var(--candidate); border-left-color: #8fb9d8; } .message.interviewer { border-left-color: var(--signal); } .role { display: block; color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
    #feedback { display: grid; gap: 10px; margin-top: 14px; } .feedback-section { border-top: 1px solid var(--line); padding-top: 10px; } ul { margin: 6px 0 0; padding-left: 20px; } .status { min-height: 24px; margin-top: 10px; color: var(--signal); } .error { color: #ff9b9b; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } main { padding: 18px 12px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Probe Interview</h1><p>Evidence-led technical conversations, one turn at a time.</p></header>
    <div class="grid">
      <section class="card" aria-labelledby="setup-heading">
        <h2 id="setup-heading">Candidate</h2>
        <label for="candidate-select">Load a sample</label>
        <select id="candidate-select"><option value="">Paste a candidate below</option></select>
        <label for="candidate-json">Candidate JSON</label>
        <textarea id="candidate-json" spellcheck="false" aria-describedby="candidate-help"></textarea>
        <p id="candidate-help">Select a sample or paste the full candidate object.</p>
        <button id="start" type="button">Start interview</button>
        <p id="status" class="status" role="status"></p>
      </section>
      <section class="card" aria-labelledby="conversation-heading">
        <h2 id="conversation-heading">Conversation</h2>
        <div id="chat" aria-live="polite"></div>
        <form id="message-form">
          <label for="message">Your answer</label>
          <textarea id="message" disabled placeholder="Start an interview to answer its first question."></textarea>
          <button id="send" disabled type="submit">Send answer</button>
        </form>
        <div id="feedback" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <script>
    const select = document.querySelector('#candidate-select'); const candidateInput = document.querySelector('#candidate-json'); const start = document.querySelector('#start'); const form = document.querySelector('#message-form'); const message = document.querySelector('#message'); const send = document.querySelector('#send'); const chat = document.querySelector('#chat'); const feedback = document.querySelector('#feedback'); const status = document.querySelector('#status'); let candidates = []; let sessionId = null;
    const setStatus = (text, error = false) => { status.textContent = text; status.className = `status${error ? ' error' : ''}`; };
    const addMessage = (role, text) => { const item = document.createElement('div'); item.className = `message ${role}`; item.innerHTML = `<span class="role">${role}</span>`; const body = document.createElement('div'); body.textContent = text; item.append(body); chat.append(item); item.scrollIntoView({ block: 'end', behavior: 'smooth' }); };
    const renderFeedback = (data) => { feedback.replaceChildren(); Object.entries(data).forEach(([key, value]) => { const section = document.createElement('section'); section.className = 'feedback-section'; const title = document.createElement('h3'); title.textContent = key; section.append(title); if (Array.isArray(value)) { const list = document.createElement('ul'); value.forEach((entry) => { const item = document.createElement('li'); item.textContent = entry; list.append(item); }); section.append(list); } else { const text = document.createElement('p'); text.textContent = value; section.append(text); } feedback.append(section); }); };
    async function postInterview(payload) { const response = await fetch('/api/interview', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }); const data = await response.json().catch(() => ({ detail: 'Server returned an invalid response.' })); if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)); return data; }
    function handleReply(data) { addMessage('interviewer', data.reply); if (data.done) { renderFeedback(data.feedback); message.disabled = true; send.disabled = true; start.disabled = false; setStatus('Interview completed.'); } else { message.disabled = false; send.disabled = false; message.focus(); setStatus('Your turn.'); } }
    select.addEventListener('change', () => { const candidate = candidates.find((entry) => entry.member.id === select.value); if (candidate) candidateInput.value = JSON.stringify(candidate, null, 2); });
    start.addEventListener('click', async () => { try { const candidate = JSON.parse(candidateInput.value); sessionId = crypto.randomUUID(); chat.replaceChildren(); feedback.replaceChildren(); start.disabled = true; setStatus('Building your interview plan...'); handleReply(await postInterview({ sessionId, candidate })); } catch (error) { start.disabled = false; setStatus(error.message || 'Candidate JSON is invalid.', true); } });
    form.addEventListener('submit', async (event) => { event.preventDefault(); const answer = message.value.trim(); if (!answer || !sessionId) return; message.disabled = true; send.disabled = true; addMessage('candidate', answer); message.value = ''; setStatus('Reviewing your answer...'); try { handleReply(await postInterview({ sessionId, message: answer })); } catch (error) { message.disabled = false; send.disabled = false; setStatus(error.message || 'Request failed.', true); } });
    fetch('/data/candidates.json').then((response) => response.json()).then((data) => { candidates = data.candidates || []; candidates.forEach((candidate) => { const option = document.createElement('option'); option.value = candidate.member.id; option.textContent = `${candidate.member.name} — ${candidate.member.jobRole}`; select.append(option); }); }).catch(() => setStatus('Sample candidates could not be loaded. Paste JSON instead.', true));
  </script>
</body>
</html>
