<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probe Interview Access</title>
  <style>
    :root { color-scheme: dark; --ink: #eaf1f5; --muted: #9aacb8; --canvas: #101922; --panel: #17232e; --line: #2d4150; --signal: #70e1bd; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top left, #1c3440, var(--canvas) 55%); color: var(--ink); font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(100% - 32px, 420px); border: 1px solid var(--line); border-left: 4px solid var(--signal); padding: 28px; background: var(--panel); } h1 { margin: 0; font-size: 2.2rem; letter-spacing: -.05em; } p { color: var(--muted); } label { display: block; margin: 18px 0 6px; font-weight: 700; } input, button { width: 100%; font: inherit; } input { padding: 11px; color: var(--ink); background: #0d151d; border: 1px solid var(--line); } button { margin-top: 14px; padding: 11px; border: 0; background: var(--signal); color: #08221a; font-weight: 800; cursor: pointer; } .error { color: #ff9b9b; min-height: 24px; } input:focus-visible, button:focus-visible { outline: 3px solid #b4ffe5; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Probe Interview</h1>
    <p>Temporary access gate for the live interview service.</p>
    <form id="login-form">
      <label for="password">Access password</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Continue</button>
      <p id="error" class="error" role="alert"></p>
    </form>
  </main>
  <script>
    document.querySelector('#login-form').addEventListener('submit', async (event) => {
      event.preventDefault(); const password = document.querySelector('#password').value; const error = document.querySelector('#error');
      const response = await fetch('/login', { method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({password}) });
      if (response.ok) { location.assign('/'); return; } const data = await response.json().catch(() => ({})); error.textContent = data.detail || 'Access request failed.';
    });
  </script>
</body>
</html>
